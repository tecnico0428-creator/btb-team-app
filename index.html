<title>오늘도 스트라이크</title>
<style>body{margin:0;background:#fce1b8;font:600 18px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#10413d}#ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}</style>

<body><div id="ld">불러오는 중...</div>
<script>
// 오늘도 스트라이크 웹 로더(v55): 링크 기간을 서버(구글 Apps Script, 서버 시각)에서 확인한 뒤에만 암호화된 앱(app.enc)을 풀어 연다.
(async function () {
  const API = "https://script.google.com/macros/s/AKfycbzAQ-vHVUhWCn5_NUrLgEBeYAJtlLeV3a7quKzGQ_tMGGau3ayMdnW6oZ8lFyW9R0Y43g/exec", AK = 'btb_access_v1', OK = 'btb_owner_v1'; const ld = document.getElementById('ld');
  const show = (why, sub) => { ld.innerHTML = '<div><div style="font-size:22px;font-weight:800;margin:10px 0">오늘도 스트라이크</div><div>' + why + '</div><div style="margin-top:14px;font-size:15px;color:#5b6a6e">' + (sub || '크루 운영진에게 새 링크를 받아 주세요.<br>이 폰에 저장된 기록은 지워지지 않았습니다.') + '</div></div>'; };
  const dec = (t) => { t = String(t).replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; const b = atob(t); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  const enc = (buf) => { const u = new Uint8Array(buf); let b = ''; for (let i = 0; i < u.length; i++) b += String.fromCharCode(u[i]); return btoa(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  // v44: 안드로이드에서 카톡·밴드 등 앱 안 브라우저로 열면 사진 공유가 안 돼서(카톡이 파일 없이 공유 창만 띄움) 기본 브라우저(크롬 등)로 다시 연다. 링크 토큰을 주소에 붙여 그대로 넘긴다.
  const UA = navigator.userAgent || ''; const inApp = /Android/i.test(UA) && /KAKAOTALK|BAND\/|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|everytimeApp|DaumApps|SamsungBrowser\/[\d.]+ \(wv\)|; wv\)/i.test(UA);
  if (inApp) { let tried = false; try { tried = !!sessionStorage.getItem('btb_ext_tried'); } catch (e) {}
    const q0 = new URLSearchParams(location.search); let tk = q0.get('k'); if (!tk) { try { const a0 = JSON.parse(localStorage.getItem(AK) || 'null'); tk = a0 && a0.tok; } catch (e) {} }
    const url = location.origin + location.pathname + (tk ? '?k=' + encodeURIComponent(tk) : '') + location.hash;
    const ext = /KAKAOTALK/i.test(UA) ? 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url) : 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;end';
    window.__BTB_EXT_URL = ext; let ownerOnly = false; try { ownerOnly = !tk && !!localStorage.getItem(OK); } catch (e) {}
    ld.innerHTML = '<div><div style="font-size:22px;font-weight:800;margin:10px 0">오늘도 스트라이크</div><div>사진 공유가 되도록 기본 브라우저로 여는 중입니다.</div><div style="margin-top:16px"><a id="extA" href="' + ext.replace(/"/g, '&quot;') + '" style="display:inline-block;padding:12px 18px;border-radius:12px;background:#dc4527;color:#fff;text-decoration:none">기본 브라우저로 열기</a></div><div style="margin-top:12px;font-size:15px;color:#5b6a6e">안 열리면 위 버튼을 누르거나, 오른쪽 위 메뉴에서 "다른 브라우저로 열기"를 눌러 주세요.' + (ownerOnly ? '<br>주인 폰이면 기본 브라우저에서 주인 링크를 한 번 더 열어 주세요.' : '') + '</div></div>';
    if (!tried && !window.__BTB_NO_REDIRECT) { try { sessionStorage.setItem('btb_ext_tried', '1'); } catch (e) {} setTimeout(() => { location.href = ext; }, 300); } // 자동 이동은 한 번만, 안내·버튼은 항상
    // v49: 기본 브라우저로 안 넘어가면(카톡 버전·설정에 따라) 막히지 않게 4초 뒤 이 화면에서 그냥 연다. 사진 공유만 안 될 수 있음.
    try { const box = ld.firstElementChild || ld; const b2 = document.createElement('div'); b2.innerHTML = '<a id="hereA" href="#" style="display:inline-block;margin-top:10px;padding:10px 16px;border-radius:12px;border:1px solid #dc4527;color:#dc4527;text-decoration:none">이 화면에서 바로 열기</a><div id="hereT" style="margin-top:6px;font-size:14px;color:#5b6a6e">4초 뒤 자동으로 열립니다(카톡 안에서는 사진 공유가 안 될 수 있어요)</div>'; box.appendChild(b2); } catch (e) {}
    await new Promise(res => { const a = document.getElementById('hereA'); if (a) a.onclick = (e) => { e.preventDefault(); res(); }; setTimeout(() => { if (document.visibilityState === 'visible') res(); else document.addEventListener('visibilitychange', function f() { if (document.visibilityState === 'visible') { document.removeEventListener('visibilitychange', f); res(); } }); }, 4000); });
    ld.innerHTML = '<div style="margin-top:30px">불러오는 중...</div>';
  }
  if (!(window.crypto && crypto.subtle)) { show('이 브라우저에서는 열 수 없습니다.', '크롬·사파리 최신판으로 열어 주세요.'); return; }
  // v47: 주인 링크(#o=)에는 서명키가 아니라 무작위 주인 비밀값만 들어 있다. 서버가 해시를 비교해 열쇠를 준다. 옛 형식(서명키 d)은 지운다.
  const ownerSecret = () => { try { const o = JSON.parse(localStorage.getItem(OK) || 'null'); if (o && o.d) { localStorage.removeItem(OK); return ''; } return o && typeof o.s === 'string' && o.s.length >= 40 ? o.s : ''; } catch (e) { return ''; } };
  const q = new URLSearchParams(location.search), hq = new URLSearchParams(location.hash.replace(/^#/, ''));
  try { const od = hq.get('o'); if (od && /^[A-Za-z0-9_-]{40,64}$/.test(od)) localStorage.setItem(OK, JSON.stringify({ s: od })); } catch (e) {}
  let tok = null, owner = false; let osec = ownerSecret(); if (osec) owner = true;
  if (!owner) { const nk = q.get('k'); let a = null; try { a = JSON.parse(localStorage.getItem(AK) || 'null'); } catch (e) {} tok = nk || (a && a.tok) || null; }
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  if (!tok && !owner) { show('이 앱은 크루 운영진이 보낸 링크로만 열 수 있습니다.'); return; }
  const getKey = async () => { const r = await fetch(API + '?m=key&' + (owner ? 'o=' + encodeURIComponent(osec) : 'k=' + encodeURIComponent(tok)) + '&t=' + Date.now()); return await r.json(); };
  let j; try { j = await getKey(); } catch (e) { show('인터넷 연결을 확인할 수 없습니다.', '연결한 뒤 다시 열어 주세요.'); return; }
  if (owner && !j.ok && j.why === 'bad') { try { localStorage.removeItem(OK); } catch (e) {} owner = false; const nk2 = q.get('k'); let a2 = null; try { a2 = JSON.parse(localStorage.getItem(AK) || 'null'); } catch (e) {} tok = nk2 || (a2 && a2.tok) || null; if (!tok) { show('주인 링크가 바뀌었습니다.', '새 주인 링크로 다시 열어 주세요.'); return; } try { j = await getKey(); } catch (e) { show('인터넷 연결을 확인할 수 없습니다.', '연결한 뒤 다시 열어 주세요.'); return; } } // 주인 값이 교체된 기기는 테스터 링크로 계속
  if (!j.ok) { show(j.why === 'expired' ? '이 링크의 사용 기간이 끝났습니다.' : j.why === 'nokey' ? '앱을 준비하는 중입니다.' : '이 링크는 사용할 수 없습니다.', j.why === 'nokey' ? '잠시 뒤 다시 열어 주세요.' : ''); return; }
  if (!owner) { try { localStorage.setItem(AK, JSON.stringify({ e: j.e, tok })); } catch (e) {} }
  const open = async (jj, fresh) => { const txt = (await (await fetch('app.enc' + (fresh ? '?t=' + Date.now() : ''), { cache: fresh ? 'no-store' : 'no-cache' })).text()).trim(); const ci = txt.indexOf(':'); const fk = txt.slice(0, ci); const kk = fk === jj.kid ? jj.key : (fk === jj.pkid ? jj.pkey : ''); if (!kk) throw new Error('kid');
    const all = dec(txt.slice(ci + 1).replace(/\+/g, '-').replace(/\//g, '_')); const key = await crypto.subtle.importKey('raw', dec(kk), { name: 'AES-GCM' }, false, ['decrypt']); const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(0, 12) }, key, all.slice(12)); return new TextDecoder().decode(pt); };
  let html = null; try { html = await open(j, false); } catch (e) { try { await new Promise(r => setTimeout(r, 2500)); j = await getKey(); if (j.ok) html = await open(j, true); } catch (e2) {} }
  if (!html) { show('앱을 여는 중 문제가 생겼습니다.', '잠시 뒤 다시 열어 주세요.'); return; }
  window.BTB_DECRYPTED = true; window.BTB_LOADER = { api: API, tok, exp: owner ? 0 : j.e, now: j.now, owner }; window.BTB_LABEL = owner ? '' : (j.d + 'D');
  document.open(); document.write(html); document.close();
})();
</script>
